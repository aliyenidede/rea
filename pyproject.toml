[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-dev"
version = "0.7.2"
description = "Deprecated — frozen at 0.7.2. Replaced by `npx readev-tools`, which installs the same workflow for any AI coding tool"
readme = "PYPI.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "aliyenidede", email = "aliyenidede@gmail.com" },
]
keywords = ["claude", "claude-code", "ai", "development", "toolkit", "agents", "workflow"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.15.6",
]

[project.urls]
Homepage = "https://github.com/aliyenidede/rea"
Repository = "https://github.com/aliyenidede/rea"
Issues = "https://github.com/aliyenidede/rea/issues"

[project.scripts]
rea = "rea.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rea*"]

[tool.setuptools.package-data]
"rea" = ["templates/**/*", "templates/**/.claude/**/*", "templates/**/.claude/agents/*", "templates/**/.github/**/*"]
