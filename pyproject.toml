[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-dev"
version = "0.7.3"
description = "Deprecated — installs nothing. Points at `npx readev-tools`, which places the same workflow into any AI coding tool"
readme = "PYPI.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "aliyenidede", email = "aliyenidede@gmail.com" },
]
keywords = ["claude", "claude-code", "ai", "development", "toolkit", "agents", "workflow"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.15.6",
]

[project.urls]
Homepage = "https://github.com/aliyenidede/rea"
Repository = "https://github.com/aliyenidede/rea"
Issues = "https://github.com/aliyenidede/rea/issues"

[project.scripts]
rea = "rea.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rea*"]

# No package-data: 0.7.3 installs nothing, so the wheel no longer carries the
# retired 0.7.x template tree. It stays in the repo as the record of what
# 0.7.1/0.7.2 shipped, and 0.7.1 on PyPI still ships it for anyone who pins
# that fallback.
