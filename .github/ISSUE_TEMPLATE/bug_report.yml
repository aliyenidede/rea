name: Bug report
description: Something the installer did was wrong — a file it placed, overwrote, or missed.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in as much as you can — the `verify` output especially
        helps narrow down installer state issues fast.

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v20.11.0
    validations:
      required: true

  - type: dropdown
    id: host-tool
    attributes:
      label: Host AI coding tool
      description: Which tool were you running the installed commands/agents in?
      options:
        - Claude Code
        - Gemini CLI
        - Other / not tool-specific (AGENTS.md only)
    validations:
      required: true

  - type: textarea
    id: verify-output
    attributes:
      label: "npx readev-tools verify output"
      description: Run `npx readev-tools verify <project>` in the affected project and paste the output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, what happened instead?
      placeholder: |
        Command: npx readev-tools setup .
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else — OS, whether the project uses symlinks, relevant file paths, etc.
    validations:
      required: false
